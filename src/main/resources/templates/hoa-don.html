<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <style>
        /* ===== PAGE SETUP ===== */
        @page {
            size: A4;
            margin: 20mm 18mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "DejaVu Sans", sans-serif;
            font-size: 13px;
            color: #333;
            margin: 0;
            padding: 0;
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 100%;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        /* ===== INFO ===== */
        .info {
            margin-bottom: 16px;
        }

        .info div {
            margin-bottom: 4px;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* RẤT QUAN TRỌNG */
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px 8px;
            vertical-align: top;
        }

        th {
            background: #f2f2f2;
            font-weight: bold;
        }

        /* ===== COLUMN WIDTHS ===== */
        th:nth-child(1), td:nth-child(1) { width: 10%; }
        th:nth-child(2), td:nth-child(2) { width: 40%; }
        th:nth-child(3), td:nth-child(3) {
            width: 10%;
            text-align: center;
        }
        th:nth-child(4), td:nth-child(4) {
            width: 20%;
            text-align: right;
            white-space: nowrap;
        }
        th:nth-child(5), td:nth-child(5) {
            width: 20%;
            text-align: right;
            white-space: nowrap;
        }

        /* ===== TOTAL ===== */
        .total {
            margin-top: 14px;
            padding-right: 10px;
            text-align: right;
            font-size: 15px;
            font-weight: bold;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 30px;
            font-size: 11px;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>HÓA ĐƠN THANH TOÁN</h1>
    </div>

    <div class="info">
        <div><b>Khách sạn:</b> {{tenKhachSan}}</div>
        <div><b>Khách hàng:</b> {{tenKhachHang}}</div>
        <div><b>Ngày tạo:</b> {{ngayTao}}</div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Loại</th>
            <th>Mô tả</th>
            <th>Số lượng</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        {{CHI_TIET}}
        </tbody>
    </table>

    <div class="total">
        Tổng tiền: {{tongTien}}
    </div>

    <div class="footer">
        Cảm ơn quý khách đã sử dụng dịch vụ
    </div>

</div>

</body>
</html>
