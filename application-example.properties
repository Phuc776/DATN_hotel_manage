spring.application.name=hotel_manage
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=NewPassWord
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.data.web.pageable.default-page-size=5

app.jwt.secret=VeryComplexSecretKeyForJWTGeneration12345
app.qr.jwt.secret=AnotherVeryVeryComplexSecretKeyForQRJWTGenerationWith@And$67890!!!
security.cccd.secret=CCCD_AES_KEY_32_BYTES_LONG_12345
app.jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true